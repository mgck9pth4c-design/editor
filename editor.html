<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tekstbewerker</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    margin:30px;
    max-width:900px;
}

.toolbar{
    margin-bottom:15px;
}

button{
    padding:8px 16px;
    font-size:15px;
    cursor:pointer;
}

#editor{
    border:1px solid #bbb;
    min-height:350px;
    padding:18px;
    line-height:1.6;
    font-size:17px;
    outline:none;
}

#status{
    margin-top:12px;
    color:#666;
    font-size:14px;
}
</style>

</head>

<body>

<div class="toolbar">
    <button onclick="resetTekst()">Reset tekst</button>
</div>

<div id="editor" contenteditable="true">
<p>Beste collega,</p>

<p>Hier staat de voorbeeldtekst die studenten mogen aanpassen.
Ze kunnen woorden vervangen, zinnen herschrijven of fouten verbeteren.</p>

<p>Na het verlaten van deze pagina worden alle wijzigingen automatisch verwijderd.</p>

<p>Met vriendelijke groeten</p>
</div>

<div id="status">
Woorden: <span id="woorden">0</span>
</div>

<script>

const editor = document.getElementById("editor");
const origineleTekst = editor.innerHTML;

function updateWoorden() {
    const tekst = editor.innerText.trim();

    const aantal = tekst === ""
        ? 0
        : tekst.split(/\s+/).length;

    document.getElementById("woorden").textContent = aantal;
}

editor.addEventListener("input", updateWoorden);

function resetTekst() {
    if (confirm("De oorspronkelijke tekst terugzetten?")) {
        editor.innerHTML = origineleTekst;
        updateWoorden();
    }
}

updateWoorden();

</script>

</body>
</html>

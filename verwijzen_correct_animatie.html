<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Vloeiende tekstanimatie</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: white;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 24px;
    padding: 0 10vw;
    box-sizing: border-box;
}

.sentences {
    width: 100%;
    max-width: 1400px;

    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 40px;
}

.sentence {
    width: 100%;
    color: black;
    line-height: 1.4;
    text-align: left;
}

.word {
    display: inline-block;
    white-space: nowrap;
    overflow: hidden;
    vertical-align: bottom;

    width: var(--w);

    transition:
        width 0.9s ease,
        color 0.7s ease,
        opacity 0.6s ease;
}

.highlight {
    color: #d40000;
}

.replace {
    color: #0a9d32;
}
</style>
</head>

<body>

<div class="sentences">
    <div class="sentence">
    De auteur heeft een model gemaakt
    <span id="target1" class="word">die</span>
    de interacties in kaart brengt.
</div>

<div class="sentence">
    Het bedrijf is erin geslaagd
    <span id="target2" class="word">haar</span>
    omzet te verdubbelen.
</div>
</div>

<script>

const target1 = document.getElementById("target1");
const target2 = document.getElementById("target2");

function animateSentence1() {

    // Beginstaat
    target1.className = "word";
    target1.style.setProperty("--w", "35px");
    target1.style.opacity = "1";
    target1.textContent = "die";

    // Stap 1
    setTimeout(() => {
        target1.classList.add("highlight");
    }, 1000);

    // Stap 2
    setTimeout(() => {
        target1.style.opacity = "0";
        target1.style.setProperty("--w", "150px");
    }, 2200);

    // Stap 3
    setTimeout(() => {
        target1.textContent = "dat";
        target1.className = "word replace";
        target1.style.opacity = "1";

        setTimeout(() => {
            target1.style.setProperty("--w", "35px");
        }, 50);

    }, 3200);
}


function animateSentence2() {

    // Beginstaat
    target2.className = "word";
    target2.style.setProperty("--w", "48px");
    target2.style.opacity = "1";
    target2.textContent = "haar";

    // Stap 1
    setTimeout(() => {
        target2.classList.add("highlight");
    }, 1000);

    // Stap 2
    setTimeout(() => {
        target2.style.opacity = "0";
        target2.style.setProperty("--w", "150px");
    }, 2200);

    // Stap 3
    setTimeout(() => {
        target2.textContent = "zijn";
        target2.className = "word replace";
        target2.style.opacity = "1";

        setTimeout(() => {
            target2.style.setProperty("--w", "38px");
        }, 50);

    }, 3200);
}


// Eerste animatie starten
animateSentence1();

// Tweede animatie starten
animateSentence2();

// Beide onafhankelijk herhalen
setInterval(animateSentence1, 6000);
setInterval(animateSentence2, 6000);

</script>

</body>
</html>

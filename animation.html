<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visualisatie alinea's</title>

<style>

body{
    margin:40px;
    font-family:Arial, Helvetica, sans-serif;
    font-size:18px;
    line-height:1.8;
    text-align:justify;
}

#toggleKnop{
    font-size:28px;
    padding:8px 16px;
    margin-bottom:25px;
    cursor:pointer;
    border:1px solid #bbb;
    border-radius:8px;
    background:white;
}

#toggleKnop:hover{
    background:#f3f3f3;
}

#pijl{
    display:inline-block;
    transition:transform .3s ease;
}

#pijl.gedraaid{
    transform:rotate(180deg);
}

#tekst{
    max-width:850px;
    transition:opacity .8s ease;
}

p{
    margin:0 0 1.2em 0;
}

#ref{
    font-size: 10px;
}

</style>

</head>

<body>

<div id="tekst"></div>
<div id="ref">
    <p>
        Naar: <i>Jongerentaal bevat minder Engels dan we denken, ontdekte Melissa Schuring</i> (www.eoswetenschap.eu, 2026)
    </p>
</div>

<button id="toggleKnop" aria-label="Wissel weergave">
    <span id="pijl">→</span>
</button>

<script>

const zonder =
`Veel volwassenen vrezen dat het Nederlands steeds verder verengelst, maar die bezorgdheid is enigszins overdreven. Jongerentaal bevat namelijk minder Engelse invloeden dan vaak wordt aangenomen. Hoewel jongeren regelmatig Engelse termen gebruiken, betekent dat niet dat het Nederlands door het Engels wordt vervangen. De aanwezigheid van Engelse woorden vormt eerder een aanvulling op het bestaande taalgebruik en hangt bovendien samen met bepaalde sociale situaties en functies, zoals het uitdrukken van een groepsgevoel of identiteit. Om te beginnen is het gebruik van Engelse woorden door jongeren sterk afhankelijk van de gesprekspartner en de context waarin een gesprek plaatsvindt. Wanneer jongeren met leeftijdsgenoten communiceren, gebruiken zij vaker Engelse termen om bijvoorbeeld enthousiasme, waardering of verbondenheid met een bepaalde groep uit te drukken. In gesprekken met volwassenen komt Engels daarentegen minder vaak voor. Engels speelt dus vooral een sociale rol binnen het taalgebruik van jongeren. Daarnaast wordt de invloed van het Engels op jongerentaal vaak overschat omdat Engelse woorden sterk de aandacht trekken binnen een Nederlandstalige zin. Ze worden opvallender uitgesproken of gaan gepaard met gebaren. Bijgevolg lijkt het alsof ze vaker voorkomen dan daadwerkelijk het geval is en wordt de invloed van het Engels groter ingeschat dan die daadwerkelijk is.`;

const met =
`
<p>Veel volwassenen vrezen dat het Nederlands steeds verder verengelst, maar die bezorgdheid is enigszins overdreven. Jongerentaal bevat namelijk minder Engelse invloeden dan vaak wordt aangenomen. Hoewel jongeren regelmatig Engelse termen gebruiken, betekent dat niet dat het Nederlands door het Engels wordt vervangen. De aanwezigheid van Engelse woorden vormt eerder een aanvulling op het bestaande taalgebruik en hangt bovendien samen met bepaalde sociale situaties en functies, zoals het uitdrukken van een groepsgevoel of identiteit.</p>

<p>Om te beginnen is het gebruik van Engelse woorden door jongeren sterk afhankelijk van de gesprekspartner en de context waarin een gesprek plaatsvindt. Wanneer jongeren met leeftijdsgenoten communiceren, gebruiken zij vaker Engelse termen om bijvoorbeeld enthousiasme, waardering of verbondenheid met een bepaalde groep uit te drukken. In gesprekken met volwassenen komt Engels daarentegen minder vaak voor. Engels speelt dus vooral een sociale rol binnen het taalgebruik van jongeren.</p>

<p>Daarnaast wordt de invloed van het Engels op jongerentaal vaak overschat omdat Engelse woorden sterk de aandacht trekken binnen een Nederlandstalige zin. Ze worden opvallender uitgesproken of gaan gepaard met gebaren. Bijgevolg lijkt het alsof ze vaker voorkomen dan daadwerkelijk het geval is en wordt de invloed van het Engels groter ingeschat dan die daadwerkelijk is.</p>
`;

const tekst = document.getElementById("tekst");
const knop = document.getElementById("toggleKnop");
const pijl = document.getElementById("pijl");

let alinea = false;

// Begin met de tekst zonder alinea's
tekst.innerHTML = zonder;

knop.addEventListener("click", () => {

    tekst.style.opacity = 0;

    setTimeout(() => {

        if(alinea){
            tekst.innerHTML = zonder;
            pijl.classList.remove("gedraaid");
        }else{
            tekst.innerHTML = met;
            pijl.classList.add("gedraaid");
        }

        tekst.style.opacity = 1;
        alinea = !alinea;

    },400);

});

</script>

</body>
</html>

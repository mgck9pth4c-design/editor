<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verwijzingsanimatie</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        height: 100%;
    }

    body {
        background: white;
        font-family: Arial, Helvetica, sans-serif;
        color: #111;
    }

    /*
        Het frame: standaard 1200 x 250.
        De hoogte volgt het frame waarin de pagina staat
        (bijvoorbeeld een iframe van 1200x250), de inhoud
        wordt verticaal gecentreerd.
    */
    .container {
        width: 100%;
        max-width: 1200px;
        height: 100%;
        min-height: 0;
        margin: 0 auto;
        padding: 0 5vw;

        display: flex;
        align-items: center;
        justify-content: center;

        /* Vangnet voor extreem smalle frames */
        overflow-x: hidden;
        overflow-y: auto;
    }

    .sentence {
        position: relative;
        width: 100%;
        text-align: center;

        /* Schaalt mee: 20px bij 1200px breed, kleiner bij smallere frames */
        font-size: clamp(14px, 1.6vw + 2px, 20px);
        line-height: 1.6;

        /* Ruimte voor de pijl boven de eerste regel */
        padding: 56px 0 10px;
    }

    /* Smalle frames: tekst loopt over meerdere regels, dus ruimere regels
       en een marge links waar de pijl langs kan lopen. */
    @media (max-width: 700px) {
        .sentence {
            line-height: 1.9;
            padding-left: 26px;
            padding-top: 40px;
            text-align: left;
        }
    }

    .word {
        display: inline-block;
    }

    /*
        De SVG ligt over de hele zin heen (de pijl zelf wordt
        berekend t.o.v. de positie van de woorden).
    */
    .arrow-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;

        overflow: visible;
        pointer-events: none;
    }

    .arrow-path {
        fill: none;
        stroke: #111;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;

        transition: d 1.2s ease-in-out;
    }

    /* Geen animatie tijdens het wijzigen van de venstergrootte */
    .no-anim .arrow-path {
        transition: none;
    }

    .ze {
        color: #16a085;
    }

    @media (prefers-reduced-motion: reduce) {
        .arrow-path {
            transition: none;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="sentence" id="sentence">

        <svg
            class="arrow-layer"
            id="arrowLayer"
            aria-hidden="true">

            <defs>
                <marker
                    id="arrowhead"
                    markerWidth="5"
                    markerHeight="5"
                    refX="2"
                    refY="2"
                    orient="auto"
                    markerUnits="strokeWidth">

                    <path d="M0,0 L0,4 L4,2 z" fill="#111"></path>

                </marker>
            </defs>

            <path
                id="arrowPath"
                class="arrow-path"
                marker-end="url(#arrowhead)">
            </path>

        </svg>

        <span id="firstWord" class="word">De</span>
        financiële
        <span id="afdeling" class="word">
            <b>afdeling</b>
        </span>
        verstrekt gegevens aan de
        <span id="directie" class="word">
            <b>directie</b>
        </span>.
        <span id="ze" class="word ze">
            Ze
        </span>
        verwerkt die gegevens in een rapport.

    </div>

</div>


<script>

const sentence = document.getElementById("sentence");
const arrowPath = document.getElementById("arrowPath");

const firstWord = document.getElementById("firstWord");
const afdeling = document.getElementById("afdeling");
const directie = document.getElementById("directie");
const ze = document.getElementById("ze");


/*
    Positie van een woord, relatief aan de zin.
    x = midden, y = bovenkant van het woord.
*/
function getWordPosition(word) {

    const w = word.getBoundingClientRect();
    const s = sentence.getBoundingClientRect();

    return {
        x: (w.left + w.right) / 2 - s.left,
        y: w.top - s.top
    };
}


/*
    Teken de pijl van "Ze" naar het doelwoord.

    - Staan alle woorden op de eerste regel (breed frame):
      een boog boven de tekst.
    - Staan ze op verschillende regels (smal frame):
      de pijl loopt via de linkermarge, zodat hij niet
      dwars door de tekst heen gaat.

    Beide gevallen gebruiken dezelfde kromme (C), zodat
    de overgang tussen de twee woorden soepel animeert.
*/
function drawArrow(target) {

    const from = getWordPosition(ze);
    const to = getWordPosition(target);
    const first = getWordPosition(firstWord);

    const tolerance = 4;

    const allOnFirstLine =
        Math.abs(from.y - first.y) < tolerance &&
        Math.abs(to.y - first.y) < tolerance;

    const gap = 6;               // afstand tussen pijl en woord
    const startY = from.y - gap;
    const endY = to.y - gap;

    let c1x, c1y, c2x, c2y;

    if (allOnFirstLine) {

        const distance = Math.abs(to.x - from.x);
        const height = Math.min(56, 24 + distance * 0.08);

        c1x = from.x;
        c1y = startY - height;
        c2x = to.x;
        c2y = endY - height;

    } else {

        // Route via de linkermarge
        const gutterX = -22;

        c1x = gutterX;
        c1y = startY - 14;
        c2x = gutterX;
        c2y = endY - 22;
    }

    arrowPath.setAttribute("d",
        `M ${from.x} ${startY}
         C ${c1x} ${c1y}
           ${c2x} ${c2y}
           ${to.x} ${endY}`
    );
}


let pointingToAfdeling = true;

function redraw() {
    drawArrow(pointingToAfdeling ? afdeling : directie);
}


/*
    Begin bij "afdeling".
*/
redraw();


/*
    Om de 2,5 seconden wisselen.
*/
setInterval(() => {
    pointingToAfdeling = !pointingToAfdeling;
    redraw();
}, 2500);


/*
    Opnieuw berekenen bij een andere venstergrootte,
    zonder animatie.
*/
function redrawInstantly() {
    document.body.classList.add("no-anim");
    redraw();
    void arrowPath.getBoundingClientRect();   // forceer reflow
    document.body.classList.remove("no-anim");
}

window.addEventListener("resize", redrawInstantly);

/* Lettertypes/layout kunnen na het laden nog verschuiven */
window.addEventListener("load", redrawInstantly);

</script>

</body>
</html>
